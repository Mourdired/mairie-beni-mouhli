<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منشورات بلدية بني موحلي</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 20px; }
       .header { background: #0a7a3b; color: white; padding: 20px; text-align: center; border-radius: 10px; margin-bottom: 20px; }
       .header h1 { margin: 0; }
       .add-btn { background: #ffc107; color: #000; padding: 12px 25px; border-radius: 8px; text-decoration: none; font-weight: bold; display: inline-block; margin-top: 10px; }
       .post { background: white; padding: 20px; margin-bottom: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
       .post h3 { color: #0a7a3b; margin-top: 0; }
       .post.date { color: #666; font-size: 14px; }
       .post.content { margin: 10px 0; line-height: 1.6; }
       .loading { text-align: center; padding: 40px; color: #666; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📢 منشورات بلدية بني موحلي</h1>
        <p>آخر الإعلانات والمنشورات الرسمية</p>
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSdnKULUD-_29BqAZg6BlxqqcSLrflPhF7m9-93cYkHM9PrGvA/viewform" target="_blank" class="add-btn">➕ إضافة منشور جديد</a>
    </div>

    <div id="posts-container">
        <div class="loading">⏳ جاري تحميل المنشورات...</div>
    </div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQKRDFSUrjOSgNG5dfw8Lz83RlKxHM5A_pUswsEeEUYGhaz6nDB_OhByFNxA9AvBssUSvjGBHI5b4IT/pub?gid=2118288231&single=true&output=csv';
        
        async function loadPosts() {
            try {
                const response = await fetch(CSV_URL);
                const data = await response.text();
                const rows = data.split('\n').slice(1); // نحذف السطر الأول تاع العناوين
                
                let postsHTML = '';
                rows.reverse().forEach(row => {
                    if(row.trim() === '') return;
                    const cols = row.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g);
                    if(!cols || cols.length < 3) return;
                    
                    const date = cols[0].replace(/"/g, '');
                    const title = cols[1].replace(/"/g, '');
                    const content = cols[2].replace(/"/g, '');
                    
                    postsHTML += `
                        <div class="post">
                            <h3>${title}</h3>
                            <div class="date">📅 ${date}</div>
                            <div class="content">${content.replace(/\n/g, '<br>')}</div>
                        </div>
                    `;
                });
                
                document.getElementById('posts-container').innerHTML = postsHTML || '<div class="loading">لا توجد منشورات حاليا</div>';
            } catch (error) {
                document.getElementById('posts-container').innerHTML = '<div class="loading">❌ خطأ في تحميل المنشورات</div>';
            }
        }
        
        loadPosts();
        // يتحدث كل دقيقة
        setInterval(loadPosts, 60000);
    </script>
</body>
</html>
        </div>
    </footer>
</body>
</html>
