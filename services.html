<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>خدمات البلدية - بلدية أيث مرحلي</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="logo"><h1>بلدية أيث مرحلي</h1><p>ولاية الجزائر</p></div>
            <nav>
                <a href="index.html">الرئيسية</a>
                <a href="services.html" class="active">الخدمات</a>
                <a href="villages.html">القرى</a>
                <a href="associations.html">الجمعيات</a>
                <a href="sports.html">الرياضة</a>
            </nav>
        </div>
    </header>
    <section class="page-title"><div class="container"><h2>الخدمات المتوفرة في البلدية</h2></div></section>
    <section class="events">
        <div class="container">
            <div class="events-grid" id="services-list"></div>
        </div>
    </section>
    <footer><div class="container"><p>© 2026 بلدية أيث مرحلي - جميع الحقوق محفوظة</p></div></footer>
    <script src="js/data.js"></script>
    <script>
        const servicesHTML = servicesData.map(service => `
            <div class="event-card">
                <h3>${service.name}</h3>
                <p>${service.description}</p>
            </div>
        `).join('');
        document.getElementById('services-list').innerHTML = servicesHTML;
    </script>
</body>
</html>
